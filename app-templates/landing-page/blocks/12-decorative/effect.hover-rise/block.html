<!-- lab-ui block · effect.hover-rise
     Brand interaction primitive. Adds the standard CTA hover halo and
     inner bottom-glow. The effect itself has no DOM — it's a
     pseudo-element applied via CSS to a set of selectors (auto-applied
     to brand primitives) and to [data-fx="rise"] (opt-in for everything
     else).

     There's nothing to render here. Importing this block means
     importing its block.css (or 'foundation/effect.hover-rise' from
     a bundler) — that's where the magic lives.

     Use opt-in on any element you want to enroll:
       <button class="my-custom-btn" data-fx="rise">…</button>
-->
<div data-block="effect.hover-rise" hidden></div>
