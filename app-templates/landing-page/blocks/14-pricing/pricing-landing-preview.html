<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiceWand pricing landing preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../00-tokens/tokens.css">
<link rel="stylesheet" href="../00-tokens/composition.css">
<link rel="stylesheet" href="../03-cta/cta.btn-base/block.css">
<link rel="stylesheet" href="../12-decorative/effect.hover-rise/block.css">
<link rel="stylesheet" href="../03-cta/cta.btn-primary-ring/block.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons-svg@0.0.3/css/flag-icons.min.css">
<link rel="stylesheet" href="../01-header/header.corporate-reference/block.css">
<link rel="stylesheet" href="./pricing.plans-flex/block.css?v=pricing-landing">
<link rel="stylesheet" href="./pricing.addons-bundles/block.css?v=pricing-landing">
<link rel="stylesheet" href="./pricing.credits-meter/block.css?v=pricing-landing">
<link rel="stylesheet" href="./pricing.matrix-collapsible/block.css?v=pricing-landing">
<link rel="stylesheet" href="./pricing.addons/block.css?v=pricing-landing-2">
<link rel="stylesheet" href="../02-footer/footer.corporate-reference/block.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-family);
  }

  .landing-main {
    display: grid;
    gap: clamp(4rem, 8vw, 7rem);
    padding: clamp(2.5rem, 5vw, 4rem) 0 clamp(5rem, 8vw, 7rem);
  }

  .landing-slot {
    scroll-margin-top: 82px;
  }

  .landing-status {
    max-width: calc(var(--container-width) + var(--container-padding-x) * 2);
    margin-inline: auto;
    padding: 18px var(--container-padding-x);
    color: var(--color-gray-blue);
    font-family: var(--font-mono);
    font-size: 0.8125rem;
  }

  .landing-status[data-state="error"] {
    color: var(--color-status-no, #FF6B6B);
  }

  @media (max-width: 760px) {
    .landing-main {
      gap: 4rem;
      padding-top: 2rem;
    }
  }
</style>
</head>
<body data-theme="cyan">
  <div data-render-block="header.corporate-reference"></div>

  <main class="landing-main">
    <div class="landing-slot" data-render-block="pricing.plans-flex"></div>
    <div class="landing-slot" data-render-block="pricing.addons-bundles"></div>
    <div class="landing-slot" data-render-block="pricing.credits-meter"></div>
    <div class="landing-slot" data-render-block="pricing.matrix-collapsible"></div>
    <div class="landing-slot">
      <div data-render-block="pricing.addons"></div>
    </div>
  </main>

  <div data-render-block="footer.corporate-reference"></div>

  <script type="module">
    const blocks = {
      "header.corporate-reference": {
        path: "../01-header/header.corporate-reference",
        script: "../01-header/header.corporate-reference/block.js",
        overrides: {
          demo_request_label: "Request demo",
          logo_aria_label: "ServiceWand",
          menu_platform: "Platform",
          menu_how_it_works: "How It Works",
          menu_industries: "Industries",
          menu_partners: "Partners",
          menu_resources: "Resources",
          menu_panel_title: "ServiceWand pricing",
          menu_panel_text: "Compare plans, add-ons, and routing capacity for field service operations.",
          menu_panel_subtext: "Pricing preview",
          menu_panel_cta_label: "Talk to sales",
          menu_resource_title: "Pricing resources",
          menu_resource_description: "Plan, capacity, and add-on guidance for operational teams.",
          nav_platform: "Platform",
          nav_how_it_works: "How It Works",
          nav_industries: "Industries",
          nav_partners: "Partners",
          nav_faq: "FAQ",
          open_menu_label: "Open menu",
          locale_selector_trigger_label: "Language",
          locale_selector_dropdown_aria_label: "Select language",
        },
      },
      "pricing.plans-flex": {
        path: "pricing.plans-flex",
        script: "pricing.plans-flex/block.js",
      },
      "pricing.addons-bundles": {
        path: "pricing.addons-bundles",
      },
      "pricing.credits-meter": {
        path: "pricing.credits-meter",
        script: "pricing.credits-meter/block.js",
      },
      "pricing.matrix-collapsible": {
        path: "pricing.matrix-collapsible",
        script: "pricing.matrix-collapsible/block.js",
      },
      "pricing.addons": {
        path: "pricing.addons",
      },
      "footer.corporate-reference": {
        path: "../02-footer/footer.corporate-reference",
        script: "../02-footer/footer.corporate-reference/block.js",
        overrides: {
          tagline: "Field service CRM for routing, dispatch, service proof, and customer operations.",
          address: "ServiceWand Inc.<br />Pricing preview<br />CMS-managed lab-ui composition<br />Service operations platform",
          nav_platform: "Platform",
          nav_how_it_works: "How It Works",
          nav_industries: "Industries",
          nav_partners: "Partners",
          nav_faq: "FAQ",
          email_general: "hello@servicewand.com",
          email_partnerships_label: "Partnerships",
          email_partnerships: "partners@servicewand.com",
          email_support_label: "Support",
          email_support: "support@servicewand.com",
          copyright_text: "Copyright 2026 ServiceWand Inc.",
          copyright_rights: "All rights reserved.",
          privacy_policy_label: "Privacy Policy",
          terms_label: "Terms & Conditions",
        },
      },
    };

    const readDefaults = (schema) => {
      const values = {};
      for (const param of schema.params || []) {
        values[param.code] = param.default == null ? "" : String(param.default);
      }
      return { ...values, ...(schema.overrides || {}) };
    };

    const renderTemplate = (html, values, id) => html
      .replace(/\bid="([^"]+)"/g, (_match, value) => `id="${value}--${id.replaceAll(".", "-")}"`)
      .replace(/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g, (_match, code) => values[code] ?? "");

    const setStatus = (target, message, state = "loading") => {
      target.innerHTML = `<p class="landing-status" data-state="${state}">${message}</p>`;
    };

    const renderBlock = async (target, id) => {
      const config = blocks[id];
      if (!config) {
        setStatus(target, `Unknown block: ${id}`, "error");
        return;
      }

      setStatus(target, `Loading ${id}...`);

      const [schemaResponse, htmlResponse] = await Promise.all([
        fetch(`./${config.path}/block.json`),
        fetch(`./${config.path}/block.html`),
      ]);

      if (!schemaResponse.ok || !htmlResponse.ok) {
        throw new Error(`Failed to load ${id}`);
      }

      const schema = await schemaResponse.json();
      const html = await htmlResponse.text();
      target.innerHTML = renderTemplate(html, readDefaults({ ...schema, overrides: config.overrides }), id);
    };

    const init = async () => {
      const mounts = Array.from(document.querySelectorAll("[data-render-block]"));

      try {
        await Promise.all(mounts.map((target) => renderBlock(target, target.dataset.renderBlock)));

        const scripts = [...new Set(Object.values(blocks).flatMap((block) => [
          ...(block.alsoInit || []),
          block.script,
        ]).filter(Boolean))];
        for (const script of scripts) {
          await import(`./${script}`);
        }
      } catch (error) {
        const target = document.querySelector("[data-render-block]");
        if (target) setStatus(target, error.message || "Failed to build pricing preview.", "error");
      }
    };

    await init();
  </script>
</body>
</html>
