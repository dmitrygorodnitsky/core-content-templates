<style>
  /* Harness chrome — NOT part of the block. Removed when block is embedded

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 64px 32px;
    font-family: var(--font-family, "Manrope", sans-serif);
    background: var(--color-bg, #FFFFFF);
    color: var(--color-text, #5C6474);
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 48px;
  }
  .harness-label {
    font-family: var(--font-mono, monospace);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--color-gray-blue, #97A2B8);
  }
  .harness-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .harness-stage--dark {
    padding: 48px;
    border-radius: 16px;
    background: var(--color-black-bg, #17171B);
    color: var(--color-gray-light, #D9D9D9);
  }
  .harness-stage--dark .btn-primary { color: var(--color-white, #fff); }

<div class="harness-stage">
