<!-- lab-ui block · section.h2-narrative-only
     Two-column narrative/framing section for vertical landings.
-->
<section class="snarr" data-block="section.h2-narrative-only">
  <div class="container">
    <p class="eyebrow snarr-eyebrow">{{eyebrow}}</p>
    <div class="snarr-grid">
      <div class="snarr-text">
        <h2 class="snarr-title">{{title}}</h2>
        <div class="snarr-body">
          <p>{{lede_1}}</p>
          <p>{{lede_2}}</p>
          <p>{{lede_3}}</p>
        </div>
      </div>

      <div class="snarr-side">
        <h2 class="snarr-title">{{side_title}}</h2>
        <div class="snarr-body">
          <p>{{side_lede_1}}</p>
          <p>{{side_lede_2}}</p>
          <p>{{side_lede_3}}</p>
        </div>
      </div>
    </div>
  </div>
</section>
