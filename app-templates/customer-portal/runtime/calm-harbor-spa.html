<!DOCTYPE html>
<html lang="en" data-theme="beauty" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm Harbor Spa | Staging Portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/routes.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <link rel="stylesheet" href="styles/seo.css">
</head>
<body>
  <section
    id="app"
    data-portal-vertical="beauty"
    data-portal-profile="appointments"
    data-portal-theme="beauty"
    data-portal-default-mode="light"
    data-portal-router-mode="hash"
    data-portal-default-route="pricing"
    data-portal-enabled-modules="pricing,products"
    data-portal-auth-mode="fixture"
    data-portal-data-mode="live"
    data-portal-case="calm-harbor-spa"
    data-portal-pim-api-base="/core-pim/api"
    data-portal-pim-organization="CALM_HARBOR_SPA_STAGING"
    data-portal-pim-product-type-code="SPA_SERVICE"
    data-portal-pim-pricing-product-type-codes="SPA_SERVICE,SPA_MEMBERSHIP"
    data-portal-pim-products-product-type-codes="SPA_RETAIL"
    data-portal-pim-price-type-code="SPA_STANDARD_PRICE"
    data-portal-pim-price-attribute-code="INTERVAL"
    data-portal-pim-price-attribute-values="ONE_TIME,MONTH"
    data-portal-pim-currency="USD"
    data-portal-pim-currency-attribute-code="CURRENCY"
    data-portal-pim-currency-attribute-values="USD"
    data-portal-pim-amount-attribute-code="AMOUNT_MINOR"
    data-portal-pim-amount-minor-divisor="100"
    data-portal-pim-cta="Book service"
  ></section>
  <script type="module" src="src/app.js"></script>
</body>
</html>
