<!DOCTYPE html>
<html lang="en" data-theme="hvac" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Portal — modular source</title>
  <!-- Silence /favicon.ico 404 in preview/CI (no favicon needed for a design source). -->
  <link rel="icon" href="data:,">
  <!-- Known external dependency: Google Fonts "Manrope", used ONLY for design preview.
       For offline / CI transfer, drop local Manrope woff2 files in styles/ and swap the
       <link> below for an @font-face. tokens.css already declares a local-first fallback
       (`@font-face ManropeFallback { src: local("Manrope") }`) and the font stack ends in
       system-ui, so layout stays intact if the CDN is blocked. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;530;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/routes.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <!-- Single mount point. src/app.js builds the AppShell into #app. -->
  <section
    id="app"
    data-portal-vertical="hvac"
    data-portal-profile="onDemand"
    data-portal-theme="hvac"
    data-portal-default-mode="light"
    data-portal-router-mode="hash"
    data-portal-auth-mode="fixture"
    data-portal-data-mode="fixture"
    data-portal-pim-api-base="/core-pim/api"
    data-portal-pim-organization="SERVICEWAND"
    data-portal-pim-product-type-code="SERVICEWAND_SAAS"
    data-portal-pim-currency="CAD"
  ></section>

  <!-- Modular ES-module runtime. Serve over HTTP (no file:// double-click). -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
