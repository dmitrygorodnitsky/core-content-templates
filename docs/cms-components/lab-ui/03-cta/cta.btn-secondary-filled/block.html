<!-- lab-ui block · cta.btn-secondary-filled
     Secondary CTA — fully filled pill with vertical-themed background
     gradient, light text, soft cyan halo (always on), and inner-bottom
     hover-rise (via effect.hover-rise). No rainbow ring; explicitly
     a different visual primitive from primary.

     The background is --cta-secondary-fill (vertical-themed by tokens).
     Snow Removal default: bronze/olive gradient. Lawn Care → dark green.
     HVAC → dark amber. Etc.
-->
<a class="btn btn-secondary btn-secondary-filled" href="{{href}}">
  <svg class="btn-star" width="16" height="16" viewBox="0 0 21 21" fill="currentColor" aria-hidden="true">
    <path d="M10.5 0L13.4698 7.53015L21 10.5L13.4698 13.4698L10.5 21L7.53015 13.4698L0 10.5L7.53015 7.53015L10.5 0Z"/>
  </svg>
  {{label}}
</a>
