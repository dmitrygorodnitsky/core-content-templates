<!-- lab-ui block · mobile.4-card-glyph
     Mobile-experience section · H2 + 3 ledes + 4 cards.
     Each card: SVG glyph + title + 2 body paragraphs. Light theme.
-->
<section class="mob4" data-block="mobile.4-card-glyph">
  <div class="container">
    <header class="mob4-top">
      <p class="eyebrow">{{eyebrow}}</p>
      <h2 class="mob4-title">{{title}}</h2>
      <div class="mob4-lede">
        <p>{{lede_1}}</p>
        <p>{{lede_2}}</p>
        <p>{{lede_3}}</p>
      </div>
    </header>

    <div class="mob4-grid">
      <article class="mob4-card" data-slot="01">
        <div class="mob4-glyph" aria-hidden="true" data-glyph-slot="01">
          <svg viewBox="0 0 64 64" fill="none"><rect x="14" y="6" width="36" height="52" rx="6" stroke="currentColor" stroke-width="2"/><line x1="22" y1="14" x2="42" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="22" y1="22" x2="42" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="22" y1="30" x2="34" y2="30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="50" r="2.5" fill="currentColor"/></svg>
        </div>
        <h3 class="mob4-card-title">{{card_1_title}}</h3>
        <p class="mob4-card-p">{{card_1_p1}}</p>
        <p class="mob4-card-p">{{card_1_p2}}</p>
      </article>
      <article class="mob4-card" data-slot="02">
        <div class="mob4-glyph" aria-hidden="true" data-glyph-slot="02">
          <svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="2"/><path d="M22 32l8 8 14-16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3 class="mob4-card-title">{{card_2_title}}</h3>
        <p class="mob4-card-p">{{card_2_p1}}</p>
        <p class="mob4-card-p">{{card_2_p2}}</p>
      </article>
      <article class="mob4-card" data-slot="03">
        <div class="mob4-glyph" aria-hidden="true" data-glyph-slot="03">
          <svg viewBox="0 0 64 64" fill="none"><path d="M14 36 L26 24 L34 32 L50 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 16 L50 16 L50 22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="48" x2="50" y2="48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h3 class="mob4-card-title">{{card_3_title}}</h3>
        <p class="mob4-card-p">{{card_3_p1}}</p>
        <p class="mob4-card-p">{{card_3_p2}}</p>
      </article>
      <article class="mob4-card" data-slot="04">
        <div class="mob4-glyph" aria-hidden="true" data-glyph-slot="04">
          <svg viewBox="0 0 64 64" fill="none"><path d="M18 10h22l8 8v36H18V10Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M40 10v9h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 27h16M25 34h13M25 41h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="43" cy="43" r="7" stroke="currentColor" stroke-width="2"/><path d="M39.5 43l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3 class="mob4-card-title">{{card_4_title}}</h3>
        <p class="mob4-card-p">{{card_4_p1}}</p>
        <p class="mob4-card-p">{{card_4_p2}}</p>
      </article>
    </div>
  </div>
</section>
