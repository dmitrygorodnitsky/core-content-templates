<!-- lab-ui block · section.h2-narrative-only
     H2 + 3 paragraphs. Canonical narrative/framing section for vertical
     landings. Optional side glyph is supported via data-has-glyph="true",
     but the durable default is text-first.
-->
<section class="snarr" data-block="section.h2-narrative-only" data-has-glyph="false">
  <div class="container">
    <div class="snarr-grid">
      <div class="snarr-text">
        <p class="eyebrow">{{eyebrow}}</p>
        <h2 class="snarr-title">{{title}}</h2>
        <div class="snarr-body">
          <p>{{lede_1}}</p>
          <p>{{lede_2}}</p>
          <p>{{lede_3}}</p>
        </div>
      </div>

      <aside class="snarr-glyph" aria-hidden="true" data-glyph-slot>
        <!-- Default glyph: orbit-ring AI radar (small). Swap via {{glyph_svg}} or hide via data-has-glyph="false" on section. -->
        <svg viewBox="0 0 240 240" preserveAspectRatio="xMidYMid meet">
          <defs>
            <radialGradient id="snarrCenter" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#6BEAF9" stop-opacity="0.55"/>
              <stop offset="60%" stop-color="#6BEAF9" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="120" cy="120" r="100" fill="url(#snarrCenter)"/>
          <circle cx="120" cy="120" r="70" fill="none" stroke="#6BC0F9" stroke-opacity="0.35" stroke-dasharray="2 6"/>
          <circle cx="120" cy="120" r="44" fill="none" stroke="#6BC0F9" stroke-opacity="0.5" stroke-dasharray="2 6"/>
          <circle cx="120" cy="120" r="10" fill="#FFFFFF" stroke="#6BC0F9" stroke-opacity="0.6"/>
          <circle cx="120" cy="120" r="3" fill="#6BC0F9"/>
        </svg>
      </aside>
    </div>
  </div>
</section>
