<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Unsubscribe · ServiceWand</title>
  <style>
:root {
  color-scheme: light;
  font: 16px/1.55 system-ui, sans-serif;
  color: #18253b;
  background: #f1f4fa;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body { margin: 0; padding: clamp(16px, 7vh, 72px) 16px; }

main {
  max-width: 560px;
  margin: auto;
  padding: clamp(22px, 6vw, 44px);
  background: #fff;
  border: 1px solid #dce3ef;
  border-radius: 16px;
}

.wordmark { display: block; width: 138px; height: auto; margin-bottom: 26px; }
h1 { margin: 0; font-size: clamp(24px, 5vw, 32px); line-height: 1.2; letter-spacing: -.025em; }
p { margin: 12px 0 0; color: #47556a; }
fieldset { border: 0; padding: 0; min-width: 0; margin: 25px 0 24px; }
legend { padding: 0; margin-bottom: 8px; font-weight: 650; }
legend span { display: inline-block; margin-left: 5px; font-size: .875rem; font-weight: 400; color: #47556a; }
label { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
input { flex: 0 0 auto; margin: 0; width: 18px; height: 18px; accent-color: #3a48bc; }
button {
  width: 100%;
  min-height: 46px;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  background: #3a48bc;
  color: #fff;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
button:hover { background: #2c399f; }
button:disabled { opacity: .65; cursor: wait; }
:focus-visible { outline: 3px solid #3a48bc; outline-offset: 3px; }
a { color: #3343b6; }
.error { color: #aa2338; }
.error:empty { margin: 0; }
  </style>
  <script type="module">
const form = document.querySelector("#unsubscribe");
const heading = document.querySelector("#title");
const intro = document.querySelector("#intro");
const submit = form.querySelector("button");
const error = document.querySelector("#error");
const params = new URLSearchParams(location.hash.slice(1));
const token = params.get("token");
const preview = params.has("preview");
const valid = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(token ?? "");

function finish(title, message, help = false) {
  form.hidden = true;
  heading.textContent = title;
  intro.textContent = message;
  if (help) {
    const link = document.createElement("a");
    link.href = "mailto:connect@servicewand.com?subject=Unsubscribe";
    link.textContent = "connect@servicewand.com";
    intro.append(" You can also email ", link, ".");
  }
  heading.tabIndex = -1;
  heading.focus();
}

if (valid || preview) {
  form.hidden = false;
  if (preview) intro.textContent = "Preview this unsubscribe page with a sample email.";
} else {
  finish("Open your unsubscribe link", "Use the unsubscribe link in your ServiceWand email.", true);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (submit.disabled) return;
  if (preview) {
    finish("You’re unsubscribed", "Preview complete. In a real email, this stops future ServiceWand outreach.");
    return;
  }
  if (!valid) return;
  const reason = new FormData(form).get("reason");
  submit.disabled = true;
  submit.textContent = "Unsubscribing…";
  error.textContent = "";
  try {
    const response = await fetch("/core-cms/api/form/send-event/" + encodeURIComponent(token) + ".json", {
      method: "POST",
      credentials: "omit",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(reason ? { REASON: reason } : {}),
      signal: AbortSignal.timeout(30000),
    });
    if (response.status === 200 || response.status === 410) {
      history.replaceState(null, "", location.pathname);
      finish("Unsubscribe request received", "We’ve received your request to stop ServiceWand outreach emails.");
    } else if (response.status === 404) {
      finish("This link is unavailable", "Open the unsubscribe link in your most recent ServiceWand email.", true);
    } else {
      throw new Error("Unsubscribe request failed");
    }
  } catch {
    const link = document.createElement("a");
    link.href = "mailto:connect@servicewand.com?subject=Unsubscribe";
    link.textContent = "email us";
    error.replaceChildren("We couldn’t confirm this request. Try again or ", link, " for help.");
  } finally {
    submit.disabled = false;
    submit.textContent = "Unsubscribe";
  }
});
  </script>
</head>
<body>
  <main>
    <img class="wordmark" src="/core/apps/snow-crm/outreach-servicewand-logo.png" alt="ServiceWand" width="138" height="32">
    <h1 id="title">Unsubscribe from outreach emails</h1>
    <p id="intro">We’ll stop sending ServiceWand outreach emails to the address that received this link.</p>
    <form id="unsubscribe" hidden>
      <fieldset>
        <legend>Why are you unsubscribing? <span>Optional</span></legend>
        <label><input type="radio" name="reason" value="NOT_RELEVANT">This isn’t relevant to my business</label>
        <label><input type="radio" name="reason" value="NOT_LOOKING">I’m not looking for software right now</label>
        <label><input type="radio" name="reason" value="TOO_MANY_EMAILS">I receive too many emails</label>
        <label><input type="radio" name="reason" value="WRONG_PERSON">I’m not the right contact</label>
        <label><input type="radio" name="reason" value="OTHER">Other</label>
      </fieldset>
      <button type="submit">Unsubscribe</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <noscript><p>To unsubscribe, reply to the email or contact <a href="mailto:connect@servicewand.com">connect@servicewand.com</a>.</p></noscript>
  </main>
</body>
</html>
